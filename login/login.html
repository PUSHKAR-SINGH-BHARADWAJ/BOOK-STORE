<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: white;
        }

        .login {
            width: 400px;
            margin: 50px auto;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            margin: auto;
        }

        td {
            padding: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 180px;
            height: 22px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 6px 18px;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="login">

    <h2>Login Page</h2>

    <form>

        <table>

            <tr>
                <td>User Name:</td>
                <td>
                    <input type="text" name="username">
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" name="password">
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</div>

</body>
</html>
