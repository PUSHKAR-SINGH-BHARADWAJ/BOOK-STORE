<!DOCTYPE html>

<html>

<head>
    <title>Cart</title>

```
<style>
    body {
        font-family: Arial;
        background-color: #fff8f0;
    }

    h2 {
        text-align: center;
        color: #d96b20;
    }

    table {
        width: 80%;
        margin: 20px auto;
        border-collapse: collapse;
        background-color: white;
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: #f7b77f;
    }

    button {
        padding: 6px 12px;
        cursor: pointer;
        border: 1px solid #555;
    }

    .remove {
        background-color: #ff9999;
    }

    .clear {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        background-color: #f7b77f;
    }
</style>
```

</head>

<body>

<h2>Shopping Cart</h2>

<table>

```
<tr>
    <th>Book</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Total</th>
    <th>Remove</th>
</tr>

<tbody id="cartItems"></tbody>

<tr>
    <th colspan="3">Grand Total</th>
    <th colspan="2" id="grandTotal">RS.0</th>
</tr>
```

</table>

<button class="clear" onclick="clearCart()">Clear Cart</button>

<script>

function showCart() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let cartItems = document.getElementById("cartItems");
    let grandTotal = 0;

    cartItems.innerHTML = "";

    if (cart.length === 0) {

        cartItems.innerHTML =
            '<tr><td colspan="5">Cart is Empty</td></tr>';

        document.getElementById("grandTotal").innerHTML = "RS.0";

        return;
    }

    cart.forEach(function(item, index) {

        let total = item.price * item.quantity;

        grandTotal = grandTotal + total;

        cartItems.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>RS.${item.price}</td>
                <td>
                    ${item.quantity}
                </td>
                <td>RS.${total}</td>
                <td>
                    <button class="remove"
                    onclick="removeItem(${index})">
                    Remove
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("grandTotal").innerHTML =
        "RS." + grandTotal;
}


function removeItem(index) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    showCart();
}


function clearCart() {

    localStorage.removeItem("cart");

    showCart();
}


showCart();

</script>

</body>
</html>
