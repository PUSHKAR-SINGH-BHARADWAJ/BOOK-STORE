<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            background-color: #fde5d2;
            padding: 10px;
        }

        table {
            margin: 30px auto;
        }

        td {
            padding: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 200px;
            height: 22px;
        }

        select {
            padding: 5px;
        }

        textarea {
            width: 250px;
            height: 80px;
        }

        .buttons {
            text-align: center;
        }
    </style>

</head>

<body>

<h2>
    REGISTRATION PAGE
</h2>

<form>

<table>

    <!-- 1. NAME -->
    <tr>
        <td>Name:</td>

        <td>
            <input type="text" name="name">
        </td>
    </tr>


    <!-- 2. PASSWORD -->
    <tr>
        <td>Password:</td>

        <td>
            <input type="password" name="password">
        </td>
    </tr>


    <!-- 3. EMAIL -->
    <tr>
        <td>E-mail ID:</td>

        <td>
            <input type="text" name="email">
        </td>
    </tr>


    <!-- 4. PHONE NUMBER -->
    <tr>
        <td>Phone Number:</td>

        <td>
            <input type="text" name="phone">
        </td>
    </tr>


    <!-- 5. SEX -->
    <tr>
        <td>Sex:</td>

        <td>
            <input type="radio" name="sex" value="male">
            Male

            <input type="radio" name="sex" value="female">
            Female
        </td>
    </tr>


    <!-- 6. DATE OF BIRTH -->
    <tr>
        <td>Date of Birth:</td>

        <td>

            <select name="day">

                <option>Day</option>

                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>

            </select>


            <select name="month">

                <option>Month</option>

                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>

            </select>


            <select name="year">

                <option>Year</option>

                <option>2000</option>
                <option>2001</option>
                <option>2002</option>
                <option>2003</option>
                <option>2004</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
                <option>2008</option>
                <option>2009</option>
                <option>2010</option>

            </select>

        </td>
    </tr>


    <!-- 7. LANGUAGES -->
    <tr>
        <td>Languages Known:</td>

        <td>

            <input type="checkbox" name="language" value="english">
            English

            <input type="checkbox" name="language" value="telugu">
            Telugu

            <input type="checkbox" name="language" value="hindi">
            Hindi

            <input type="checkbox" name="language" value="tamil">
            Tamil

        </td>
    </tr>


    <!-- 8. ADDRESS -->
    <tr>
        <td>Address:</td>

        <td>
            <textarea name="address"></textarea>
        </td>
    </tr>


    <!-- BUTTONS -->
    <tr>
        <td></td>

        <td class="buttons">

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </td>
    </tr>

</table>

</form>

</body>
</html>
