<!DOCTYPE html>
<html>

<head>
    <title>CIVIL Catalogue</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #f7b77f;
        }

        img {
            width: 80px;
            height: 100px;
        }
         button {
            background-color: #d7a717;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0f5f5d;
        }
    </style>

</head>

<body>

<h2>CIVIL BOOK CATALOGUE</h2>

<table>

    <tr>
        <th>Book</th>
        <th>Author</th>
        <th>Publisher</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>

    <tr>
        <td>
            <img src="https://m.media-amazon.com/images/I/51fNrsfgtfL._UF1000,1000_QL80_.jpg">
            <br>BASIC CIVIL ENGINEERING
        </td>

        <td>SATISH GOPI</td>

        <td>PEARSON</td>

        <td>RS.388</td>

        <td>
            <button onclick="addToCart('BASIC CIVIL ENGINEERING', 388)">
    Add to Cart
</button>
        </td>
    </tr>

    <tr>
        <td>
            <img src="https://i0.wp.com/civiconcepts.com/wp-content/uploads/2022/01/Building-Planning-and-Drawing-Book-Pdf.jpg?resize=1024%2C1024&ssl=1">
            <br>BUILDING PLANNING AND DRAWING
        </td>

        <td>DR.N.KUMARA SWAMY</td>

        <td>CHAROTAR</td>

        <td>RS.640</td>

        <td>
            <button onclick="addToCart('BUILDING PLANNING AND DRAWING', 640)">
    Add to Cart
</button>
        </td>
    </tr>

</table>
<script>

function addToCart(name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let existing = cart.find(function(item) {
        return item.name === name;
    });

    if (existing) {
        existing.quantity++;
    } 
    else {
        cart.push({
            name: name,
            price: price,
            quantity: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(name + " added to cart!");
}

</script>

</body>

</html>
